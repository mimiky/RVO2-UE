<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <title>Quantumlens</title>
   <script>
        // 针对iOS 10+的缩放禁用增强
        document.addEventListener('touchstart', function (event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('gesturestart', function (event) {
            event.preventDefault();
        });
        document.addEventListener('gesturechange', function (event) {
            event.preventDefault();
        });
        document.addEventListener('gestureend', function (event) {
            event.preventDefault();
        });
    </script>
  <style>
    * {
      padding: 0;
      margin: 0;
    }

    html {
      /* fix mobile viewport menu bar on iOS */
      height: -webkit-fill-available;
    }

    body {
      height: 100%;
      /* fix mobile viewport menu bar on iOS */
      height: -webkit-fill-available;
      width: 100%;
      text-align: center;
    }

    #unity-container {
      position: absolute;
      left: 0px;
      top: 0px;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #222;
    }

    /* Default values, might be overwritten by aspect ratio media queries */
    #unity-canvas {
      width: 100%;
      height: 100%;
      background-color: #000;
    }

    @media (min-aspect-ratio: 3/1) {
      #unity-canvas {
        width: auto;
        height: 100%;
        aspect-ratio: 3/1;
      }
    }

    @media (max-aspect-ratio: 1/2) {
      #unity-canvas {
        width: 100%;
        height: auto;
        aspect-ratio: 1/2;
      }
    }
  </style>
  <link rel="stylesheet" href="debug-console.css">
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
  <script src="Build/WebGL_Build.loader.js"></script>
  <script>
    // choose the data file based on whether there's support for the ASTC texture compression format
    var dataFile = "/WebGL_Build.data.unityweb";
    var c = document.createElement("canvas");
    var gl = c.getContext("webgl");
    var gl2 = c.getContext("webgl2");
    if ((gl && gl.getExtension('WEBGL_compressed_texture_astc')) || (gl2 &&
            gl2.getExtension('WEBGL_compressed_texture_astc'))) {
      dataFile =  "/WebGL_Mobile.data.unityweb";
    }   
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WebGL_Build.loader.js";
    var config = {
      dataUrl: buildUrl + dataFile,
      frameworkUrl: buildUrl + "/WebGL_Build.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL_Build.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Tony",
      productName: "Quantumlens",
      productVersion: "1.0",
    };
   var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if(isMobile) {
      // Define a maximum pixel ratio for mobile to avoid rendering at too high resolutions
      const maxPixelRatioMobile = 2.0;
      config.devicePixelRatio = Math.min(window.devicePixelRatio, maxPixelRatioMobile);
    }

    var canvas = document.querySelector("#unity-canvas");
    var myGameInstance; // This variable can be used to access the application with .SendMessage() commands
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function() {
      createUnityInstance(canvas, config, function(progress) {
      }).then(function(unityInstance) {
        myGameInstance = unityInstance;
      }).catch(function(message) {
        alert(message);
      });
    };
    //JS->Unity消息
    window.addEventListener('message', function(event) {
      var message = event.data;
      console.log("Receive Window Message:"+JSON.stringify(message));
      if (message.name){
        if (Array.isArray(message.data)) {
          J2UPostMessage(JSON.stringify(message));
        } else {
          console.log("Receive Window Message data is not an array.");
        }
      }
    }, false);
    function J2UPostMessage(msg){
      myGameInstance.SendMessage("JsCall", "J2UPostMessage", msg);
    }
    //Unity->JS消息
    window.U2JPostMessage = function(msg){
      window.parent.postMessage(msg,"*")
    }
    window.ReloadPage = function(){
      location.reload();
    }
    window.onbeforeunload = function(e) {
      myGameInstance.SendMessage("JsCall", "OnBeforeunload");
    }
    document.body.appendChild(script);
  </script>
  <!-- Add an html debug console and handle unity rich text styling for both html and browser console-->
  <script src="./debug-console.js"></script>
</body>

</html>
